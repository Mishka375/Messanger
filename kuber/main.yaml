# Кластер мессенджера

apiVersion: v1
kind: Namespace
metadata:
  name: messenger

---
# Объект, где хранится скрытая информация

apiVersion: v1
kind: Secret
metadata:
  name: secret
  namespace: messenger
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"

---
# База данных users

apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: messenger
spec:
  selector:
    app: users-db
  ports:
  - port: 5432

---
# Объект базы данных users

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: messenger
spec:
  selector:
    matchLabels:
      app: users-db
  serviceName: "users-db"
  replicas: 1
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: secret
        env:
        - name: POSTGRES_DB
          value: "users"
        volumeMounts:
        - name: users-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: users-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---
# База данных chats

apiVersion: v1
kind: Service
metadata:
  name: chats-db
  namespace: messenger
spec:
  selector:
    app: chats-db
  ports:
  - port: 5432

---
# Объект базы данных chats

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chats-db
  namespace: messenger
spec:
  selector:
    matchLabels:
      app: chats-db
  serviceName: "chats-db"
  replicas: 1
  template:
    metadata:
      labels:
        app: chats-db
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: secret
        env:
        - name: POSTGRES_DB
          value: "chats"
        volumeMounts:
        - name: chats-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: chats-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---
# База данных Redis

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: messenger
spec:
  selector:
    app: redis
  ports:
  - port: 6379

---
# Объект базы данных Redis

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: messenger
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
# Backend Service

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: messenger
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Объект Backend

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: messenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend:latest
        ports:
        - containerPort: 5000
        - containerPort: 8000
        env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: secret
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST_SESSIONS
          value: "redis"
        - name: DATABASE_HOST_USERS
          value: "users-db"
        - name: DATABASE_HOST_CHATS
          value: "chats-db"
        - name: DATABASE_NAME_USERS
          value: "users"
        - name: DATABASE_NAME_CHATS
          value: "chats"
        - name: DATABASE_PORT
          value: "5432"
        - name: REDIS_PORT_SESSIONS
          value: "6379"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10


---
# Frontend

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: messenger
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort:  80
  type: ClusterIP



---
# Объект Frontend

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: messenger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend:latest
        ports:
        - containerPort: 80

---
# Входная точка Frontend

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: messenger
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: frontend
            port: 
              number: 80
