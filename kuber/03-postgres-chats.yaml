apiVersion: v1
kind: Service
metadata:
  name: chats-db
  namespace: messanger
spec:
  ports:
    - port: 5432
  selector:
    app: chats-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chats-db
  namespace: messanger
spec:
  serviceName: "chats-db"
  replicas: 1
  selector:
    matchLabels:
      app: chats-db
  template:
    metadata:
      labels:
        app: chats-db
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: POSTGRES_DB
          value: "chats"
        volumeMounts:
        - name: chats-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: chats-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi