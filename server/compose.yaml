services:
    backend:
        build:
            context: ./backend/system
            dockerfile: Dockerfile
        container_name: backend
        ports:
            - 8000:8000
            - 5000:5000
        environment:
            DATABASE_HOST_USERS: users-db
            DATABASE_NAME_USERS: users

            DATABASE_HOST_CHATS: chats-db
            DATABASE_NAME_CHATS: chats

            DATABASE_PORT: 5432
            DATABASE_USER: postgres
            DATABASE_PASSWORD: password

            REDIS_HOST_SESSIONS: redis-sessions
            REDIS_PORT_SESSIONS: 6379
        depends_on:
            users_db:
                condition: service_healthy
            chats_db:
                condition: service_healthy
        networks:
            - local
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "python", "-c",
                   "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)"]
            interval: 10s
            timeout: 5s
            retries: 5

    frontend:
        build:
            context: ./frontend
        container_name: frontend
        ports:
            - "8080:80"
            - "8443:443"
        volumes:
            - ./certbot/conf:/etc/letsencrypt:ro
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - local
        restart: unless-stopped

    users_db:
        image: postgres:18-alpine
        container_name: users-db
        volumes:
            - users-data:/var/lib/postgresql
            - ./backend/database/users/db_init:/docker-entrypoint-initdb.d
        environment:
            POSTGRES_DB: users
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - local
        restart: unless-stopped

    chats_db:
        image: postgres:18-alpine
        container_name: chats-db
        volumes:
            - chats-data:/var/lib/postgresql
            - ./backend/database/chats/db_init:/docker-entrypoint-initdb.d
        environment:
            POSTGRES_DB: chats
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d chats"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - local
        restart: unless-stopped


    redis_sessions:
        image: redis:8-alpine
        container_name: redis-sessions
        networks:
            - local
        restart: unless-stopped



    prometheus:
        image: prom/prometheus
        container_name: prometheus
        volumes:
            - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9091:9090"
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - local
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
        - "3000:3000"
        volumes:
        - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./backend/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
        - grafana-data:/var/lib/grafana
        environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
        networks:
            - local
        restart: unless-stopped
        depends_on:
        - prometheus

volumes:
    users-data:
    chats-data:
    grafana-data:

networks:
    local:
