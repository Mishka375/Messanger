<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Микросервисы в K8s</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Frontend Запущен!</h1>
        <p>Статус бэкенда: <strong id="api-status">Загрузка...</strong></p>
    </div>

    <script>
        // Запрос идет относительно текущего домена на /api
        fetch('/api')
            .then(response => response.json())
            .then(data => {
                document.getElementById('api-status').innerText = data.message;
            })
            .catch(err => {
                document.getElementById('api-status').innerText = "Ошибка подключения к API";
            });
    </script>
</body>
</html>
