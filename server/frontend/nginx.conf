server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Перенаправление всех путей на index.html для работы роутинга SPA
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API-запросов на бэкенд внутри кластера K8s
    location /api/ {
        # proxy_pass http://backend.messenger.svc.cluster.local:5000/;
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
